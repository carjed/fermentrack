start_profile:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: fermentrack
    profile:
      required: true
      example: "Lager - 10 day"
      selector:
        text:
    start_at_hours:
      required: false
      example: 0
      selector:
        number:
          min: 0
          max: 2000
          step: 0.5
          unit_of_measurement: h
          mode: box

start_beer:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: fermentrack
    name:
      required: true
      example: "Oktoberfest 2026"
      selector:
        text:

set_logging:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: fermentrack
    status:
      required: true
      selector:
        select:
          options:
            - active
            - paused
            - stopped
